<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>You AR</title>
<style>
  :root { --accent:#ff4f81; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; background:#000; color:#fff; font-family:system-ui,-apple-system,"Hiragino Sans",sans-serif; overflow:hidden; overscroll-behavior:none; }
  #video { position:fixed; inset:0; width:100%; height:100%; object-fit:cover; background:#111; }
  #stage { position:fixed; inset:0; touch-action:none; }
  #me { position:absolute; left:0; top:0; transform-origin:50% 50%; max-width:none; user-select:none; -webkit-user-drag:none; pointer-events:none; display:none; filter:drop-shadow(0 8px 12px rgba(0,0,0,.35)); }
  #start { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px; padding:24px; text-align:center; background:linear-gradient(160deg,#1b1030,#0b0b14); z-index:10; }
  #start h1 { margin:0; font-size:2.4rem; letter-spacing:.04em; }
  #start p { margin:0; opacity:.8; line-height:1.6; max-width:30em; }
  button, label.btn { appearance:none; border:0; border-radius:999px; padding:14px 22px; font-size:1rem; font-weight:600; color:#fff; background:var(--accent); cursor:pointer; display:inline-block; }
  button.sub, label.sub { background:rgba(255,255,255,.16); backdrop-filter:blur(8px); }
  #bar { position:fixed; left:0; right:0; bottom:0; padding:12px 12px calc(12px + env(safe-area-inset-bottom)); display:none; flex-direction:column; gap:10px; background:linear-gradient(transparent,rgba(0,0,0,.6)); z-index:5; }
  #bar .row { display:flex; gap:8px; justify-content:center; flex-wrap:wrap; align-items:center; }
  #bar button, #bar label.btn { padding:10px 16px; font-size:.9rem; }
  #bar .range { display:flex; align-items:center; gap:8px; font-size:.8rem; background:rgba(255,255,255,.16); border-radius:999px; padding:6px 14px; }
  #bar input[type=range] { width:110px; accent-color:var(--accent); }
  #toast { position:fixed; top:calc(12px + env(safe-area-inset-top)); left:50%; transform:translateX(-50%); background:rgba(0,0,0,.7); padding:8px 16px; border-radius:999px; font-size:.85rem; z-index:20; opacity:0; transition:opacity .25s; pointer-events:none; }
  #toast.show { opacity:1; }
  input[type=file] { display:none; }
</style>
</head>
<body>
<video id="video" playsinline muted autoplay></video>
<div id="stage"><img id="me" alt="me"></div>

<div id="start">
  <h1>You AR</h1>
  <p>カメラ越しの世界に「あなた」を登場させます。<br>
     写真を選んで、カメラを起動してください。映像は端末の外に送信されません。</p>
  <label class="btn sub" for="file0">① 自分の写真を選ぶ</label>
  <input id="file0" type="file" accept="image/*">
  <button id="go" disabled>② ARを始める</button>
  <p id="hint" style="font-size:.85rem"></p>
</div>

<div id="bar">
  <div class="row">
    <label class="range">背景除去 <input id="tol" type="range" min="0" max="120" value="40"></label>
    <label class="range"><input id="keyOn" type="checkbox" checked> 背景を消す</label>
    <label class="range"><input id="anchor" type="checkbox" checked> 空間に固定</label>
  </div>
  <div class="row">
    <label class="btn sub" for="file1">写真変更</label>
    <input id="file1" type="file" accept="image/*">
    <button class="sub" id="flip">カメラ切替</button>
    <button class="sub" id="mirror">左右反転</button>
    <button id="shot">📷 撮影</button>
  </div>
</div>
<div id="toast"></div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const video = $('video'), stage = $('stage'), me = $('me');
  const state = { x:0, y:0, s:1, r:0, flip:1, facing:'environment', src:null, cut:null, stream:null };
  let baseW = 0, baseH = 0;

  const toast = msg => { const t=$('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toast.t); toast.t=setTimeout(()=>t.classList.remove('show'),2200); };

  /* ---------- 画像読み込み & 背景除去 ---------- */
  function loadFile(file) {
    if (!file) return;
    const img = new Image();
    img.onload = () => {
      const max = 1200, k = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      state.src = c; applyKey(); $('go').disabled = false;
      $('hint').textContent = '写真を読み込みました';
    };
    img.src = URL.createObjectURL(file);
  }

  // 四隅の色を背景とみなし、近い色を透明にする(単色背景向けの簡易クロマキー)
  function applyKey() {
    const src = state.src; if (!src) return;
    const c = document.createElement('canvas'); c.width = src.width; c.height = src.height;
    const g = c.getContext('2d', { willReadFrequently:true });
    g.drawImage(src, 0, 0);
    if ($('keyOn').checked) {
      const d = g.getImageData(0, 0, c.width, c.height), a = d.data, W = c.width, H = c.height;
      const pts = [[2,2],[W-3,2],[2,H-3],[W-3,H-3]].map(([x,y]) => { const i=(y*W+x)*4; return [a[i],a[i+1],a[i+2],a[i+3]]; });
      if (pts.some(p => p[3] < 250)) { /* すでに透過PNG */ }
      else {
        const bg = [0,1,2].map(k => pts.reduce((s,p)=>s+p[k],0)/4);
        const tol = +$('tol').value, soft = 25;
        for (let i = 0; i < a.length; i += 4) {
          const dist = Math.hypot(a[i]-bg[0], a[i+1]-bg[1], a[i+2]-bg[2]);
          if (dist < tol) a[i+3] = 0;
          else if (dist < tol + soft) a[i+3] = Math.round(255 * (dist - tol) / soft);
        }
        g.putImageData(d, 0, 0);
      }
    }
    state.cut = c;
    me.src = c.toDataURL('image/png');
    me.onload = () => { baseH = Math.min(innerHeight * 0.6, c.height); baseW = baseH * c.width / c.height; me.style.width = baseW+'px'; me.style.height = baseH+'px'; if (!me.dataset.placed) { place(); me.dataset.placed = 1; } render(); };
  }

  /* ---------- カメラ ---------- */
  async function startCamera() {
    if (state.stream) state.stream.getTracks().forEach(t => t.stop());
    try {
      state.stream = await navigator.mediaDevices.getUserMedia({ video:{ facingMode:state.facing, width:{ideal:1920}, height:{ideal:1080} }, audio:false });
    } catch (e) {
      toast('カメラを起動できません: ' + (e.message || e.name)); throw e;
    }
    video.srcObject = state.stream;
    video.style.transform = state.facing === 'user' ? 'scaleX(-1)' : '';
    await video.play().catch(()=>{});
  }

  /* ---------- 配置 & ジェスチャ ---------- */
  function place() { state.x = innerWidth / 2; state.y = innerHeight * 0.55; state.s = 1; state.r = 0; refAnchor(); }
  function render() {
    const ox = state.anchorOn ? state.ax : 0, oy = state.anchorOn ? state.ay : 0;
    me.style.display = 'block';
    me.style.transform = `translate(${state.x + ox - baseW/2}px, ${state.y + oy - baseH/2}px) rotate(${state.r}rad) scale(${state.s * state.flip}, ${state.s})`;
  }

  const ptrs = new Map(); let last = null;
  stage.addEventListener('pointerdown', e => { stage.setPointerCapture(e.pointerId); ptrs.set(e.pointerId, e); last = null; });
  stage.addEventListener('pointermove', e => {
    if (!ptrs.has(e.pointerId)) return;
    const prev = ptrs.get(e.pointerId); ptrs.set(e.pointerId, e);
    if (ptrs.size === 1) {
      state.x += e.clientX - prev.clientX; state.y += e.clientY - prev.clientY;
    } else if (ptrs.size === 2) {
      const [a, b] = [...ptrs.values()];
      const dist = Math.hypot(a.clientX-b.clientX, a.clientY-b.clientY), ang = Math.atan2(b.clientY-a.clientY, b.clientX-a.clientX);
      if (last) { state.s = Math.min(6, Math.max(0.1, state.s * dist / last.dist)); state.r += ang - last.ang; }
      last = { dist, ang };
    }
    render();
  });
  const up = e => { ptrs.delete(e.pointerId); last = null; };
  stage.addEventListener('pointerup', up); stage.addEventListener('pointercancel', up);
  stage.addEventListener('wheel', e => { e.preventDefault(); state.s = Math.min(6, Math.max(0.1, state.s * (e.deltaY < 0 ? 1.08 : 0.92))); render(); }, { passive:false });

  /* ---------- ジャイロで空間に固定 ---------- */
  const HFOV = 60; // 想定する水平画角(度)
  state.anchorOn = true; state.ax = 0; state.ay = 0;
  let ori = null, ref = null;
  function refAnchor() { ref = ori ? { ...ori } : null; state.ax = state.ay = 0; }
  const wrap = d => ((d + 540) % 360) - 180;
  function onOrient(e) {
    if (e.alpha == null) return;
    const heading = e.webkitCompassHeading != null ? 360 - e.webkitCompassHeading : e.alpha;
    ori = { yaw: heading, pitch: e.beta };
    if (!ref) ref = { ...ori };
    const ppd = innerWidth / HFOV;
    state.ax = wrap(ori.yaw - ref.yaw) * ppd;           // 右へ向く→被写体は左へ
    state.ay = (ori.pitch - ref.pitch) * ppd;            // 上へ向ける→被写体は下へ
    if (state.anchorOn) render();
  }
  async function enableMotion() {
    try {
      if (window.DeviceOrientationEvent && typeof DeviceOrientationEvent.requestPermission === 'function') {
        const r = await DeviceOrientationEvent.requestPermission(); if (r !== 'granted') return;
      }
      addEventListener('deviceorientation', onOrient, true);
    } catch (_) {}
  }
  // 固定ONにしたとき、現在位置を基準に取り直す
  $('anchor').onchange = e => {
    if (!e.target.checked) { state.x += state.ax; state.y += state.ay; }
    else { state.x -= 0; }
    state.anchorOn = e.target.checked; refAnchor(); render();
  };

  /* ---------- UI ---------- */
  $('file0').onchange = e => loadFile(e.target.files[0]);
  $('file1').onchange = e => loadFile(e.target.files[0]);
  $('tol').oninput = applyKey; $('keyOn').onchange = applyKey;
  $('go').onclick = async () => {
    await enableMotion();
    try { await startCamera(); } catch (_) { return; }
    $('start').style.display = 'none'; $('bar').style.display = 'flex';
    place(); render(); toast('ドラッグで移動 / 2本指で拡大・回転');
  };
  $('flip').onclick = async () => { state.facing = state.facing === 'environment' ? 'user' : 'environment'; await startCamera(); };
  $('mirror').onclick = () => { state.flip *= -1; render(); };
  addEventListener('resize', () => { if (baseH) render(); });

  /* ---------- 撮影 ---------- */
  $('shot').onclick = () => {
    const vw = video.videoWidth, vh = video.videoHeight; if (!vw) return;
    const W = innerWidth, H = innerHeight, k = Math.max(W / vw, H / vh);
    const out = document.createElement('canvas'), S = 2; out.width = W * S; out.height = H * S;
    const g = out.getContext('2d'); g.scale(S, S);
    g.save();
    if (state.facing === 'user') { g.translate(W, 0); g.scale(-1, 1); }
    g.drawImage(video, (W - vw * k) / 2, (H - vh * k) / 2, vw * k, vh * k);
    g.restore();
    const ox = state.anchorOn ? state.ax : 0, oy = state.anchorOn ? state.ay : 0;
    g.translate(state.x + ox, state.y + oy); g.rotate(state.r); g.scale(state.s * state.flip, state.s);
    g.drawImage(state.cut, -baseW / 2, -baseH / 2, baseW, baseH);
    out.toBlob(b => {
      const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = 'you-ar.png'; a.click();
      toast('保存しました');
    }, 'image/png');
  };

  // リポジトリに me.png があれば自動で読み込む
  fetch('me.png').then(r => r.ok ? r.blob() : null).then(b => { if (b && b.type.startsWith('image')) loadFile(b); }).catch(() => {});
})();
</script>
</body>
</html>
